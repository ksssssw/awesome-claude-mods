name: Bug report
description: A mod draws or behaves wrong
labels: [bug]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Mod
      options: [step-tracker, other]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`claude --version` and the mod's version from `/plugin`"
      placeholder: "Claude Code 2.1.312, step-tracker 0.6.0"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [Terminal (fullscreen), Terminal (main screen), Desktop app, VS Code, Other]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: A screenshot helps. Crop out anything private, such as paths or repository names.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
