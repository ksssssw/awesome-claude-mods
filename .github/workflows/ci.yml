name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # Pinned so a new release cannot change what passes; raise it on purpose
      - run: npm install -g @anthropic-ai/claude-code@2.1.312
      - run: claude --version
      - run: scripts/check.sh --history
